# Local Supabase development configuration for WE.
project_id = "we"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "we://email-confirmed",
  "we://password-recovery",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Account emails, in WE's voice. Local dev reads these files; the hosted
# project needs the same HTML pasted into Authentication > Emails.
[auth.email.template.confirmation]
subject = "Confirm your email for WE"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your WE password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email for WE"
content_path = "./supabase/templates/email_change.html"

[functions.cleanup-life-resources]
verify_jwt = true

[functions.synthesize-shared-journeys]
verify_jwt = false
